name: Set up repository tooling
description: Build and test the isolated Rust CLI without resolving the node workspace.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.99.1
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          core/kontor-build/target
        key: kontor-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/kontor-build/Cargo.lock', 'core/kontor-build/Cargo.toml') }}
    - name: Test repository tooling
      shell: bash
      env:
        RUSTC_WRAPPER: ""
        CCACHE_DISABLE: "1"
      run: cargo test --locked --manifest-path core/kontor-build/Cargo.toml -j 2 --no-fail-fast
