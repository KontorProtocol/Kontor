name: Native Wasm stack qualification
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: Release qualification with dev smoke, or full dev/release comparison
        required: true
        default: release
        type: choice
        options: [release, full]
permissions:
  contents: read
jobs:
  qualify:
    uses: ./.github/workflows/rust-tests.yml
    with:
      stack: true
      profiles: ${{ inputs.profiles }}
      matrix: '{"include":[{"os":"ubuntu-24.04","arch":"X64","profile":"release","workspace":false},{"os":"ubuntu-24.04-arm","arch":"ARM64","profile":"release","workspace":false},{"os":"macos-15","arch":"ARM64","profile":"release","workspace":false},{"os":"ubuntu-24.04","arch":"X64","profile":"dev","workspace":false},{"os":"ubuntu-24.04-arm","arch":"ARM64","profile":"dev","workspace":false},{"os":"macos-15","arch":"ARM64","profile":"dev","workspace":false}]}'
