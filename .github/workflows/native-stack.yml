name: Native Wasm stack qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Qualification or S2 resource evidence stage
        required: true
        default: qualify
        type: choice
        options: [qualify, discovery, guard, chain, vmmap, final]
      profiles:
        description: Release qualification with dev smoke, or full dev/release comparison
        required: true
        default: release
        type: choice
        options: [release, full]
      reviewed_discovery_run_id:
        description: Reviewed S2 discovery run ID for the final stage
        required: false
        type: string

permissions:
  contents: read

jobs:
  scope:
    name: Stack qualification change scope
    if: github.event_name != 'workflow_dispatch' || inputs.stage == 'qualify'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      profile_policy: ${{ steps.select.outputs.profile_policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test qualification selection
        run: python3 -m unittest discover -s tools/ci -p 'test_stack_qualification_scope.py' -v
      - name: Select qualification from the complete change set
        id: select
        run: python3 tools/ci/stack_qualification_scope.py

  controls:
    name: Native stack evidence controls
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python evidence validator
        run: python3 -m pip install -r tools/native-stack/requirements-resource.txt
      # Process-identity controls exercise Linux /proc and cgroups.
      - name: Test qualification controls
        run: python3 -m unittest discover -s tools/native-stack -p 'test_*.py' -v

  qualify:
    name: Native stack (${{ matrix.os }}, ${{ matrix.profile }}${{ matrix.profile == 'dev' && needs.scope.outputs.profile_policy == 'release' && ' smoke' || '' }})
    needs: [scope, controls]
    if: needs.scope.outputs.required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        profile: [dev, release]
        include:
          - os: ubuntu-24.04
            arch: X64
          - os: ubuntu-24.04-arm
            arch: ARM64
          - os: macos-15
            arch: ARM64
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTC_WRAPPER: ""
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python evidence validator
        run: python3 -m pip install -r tools/native-stack/requirements-resource.txt
      - name: Check runner architecture
        run: test "$RUNNER_ARCH" = "${{ matrix.arch }}"
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libboost-all-dev libevent-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install boost libevent zeromq
      - name: Compile qualification test
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          evidence="target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/$PROFILE"
          mkdir -p "$evidence"
          flags=()
          if [[ "$PROFILE" == release ]]; then flags+=(--release); fi
          cargo test --locked --manifest-path core/Cargo.toml -p indexer --lib --no-run --message-format=json -j2 "${flags[@]}" > "$evidence/cargo.json"
          jq -ser '[.[] | select(.reason == "compiler-artifact" and .target.name == "indexer" and (.target.kind | index("lib")) != null and .profile.test == true and .executable != null)] | if length == 1 then .[0].executable else error("expected exactly one indexer lib test executable") end' "$evidence/cargo.json" > target/native-stack-evidence/binary-path
          test -s target/native-stack-evidence/binary-path
      - name: Exercise paid, view, and Core chain boundaries
        if: matrix.profile == 'release' || needs.scope.outputs.profile_policy == 'full'
        run: |
          set -o pipefail
          binary=$(cat target/native-stack-evidence/binary-path)
          mkdir -p "target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/${{ matrix.profile }}"
          "$binary" --exact runtime::call::tests::sequential_chains::deep_sequential_chains_survive_in_separate_processes --nocapture 2>&1 | tee "target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/${{ matrix.profile }}/chain-matrix.log"
      - name: Exercise owned paid, view, and Core chain boundaries
        if: matrix.profile == 'release' || needs.scope.outputs.profile_policy == 'full'
        run: |
          set -o pipefail
          binary=$(cat target/native-stack-evidence/binary-path)
          evidence="target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/${{ matrix.profile }}"
          : > "$evidence/owned-chain-matrix.log"
          for mode in paid view core; do
            for depth in 63 64; do
              KONTOR_CHAIN_MODE="$mode" KONTOR_CHAIN_DEPTH="$depth" "$binary" --exact runtime::call::tests::sequential_chains::owned_chain_probe_child --ignored --nocapture 2>&1 | tee -a "$evidence/owned-chain-matrix.log"
            done
          done
      - name: Exercise ownership cancellation, yielding, and drain controls
        if: matrix.profile == 'release' || needs.scope.outputs.profile_policy == 'full'
        run: |
          set -o pipefail
          binary=$(cat target/native-stack-evidence/binary-path)
          evidence="target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/${{ matrix.profile }}"
          : > "$evidence/ownership-controls.log"
          for test in canonical_lease_drains_native_guest_before_releasing_runtime canonical_and_simulation_children_keep_no_yield_policy nested_api_children_inherit_actual_fuel_yields cancelling_nested_yielding_api_guest_joins_before_runtime_reuse cancelling_fuel_yielding_guest_joins_before_pool_reuse; do
            "$binary" --exact "runtime::ownership::tests::$test" --nocapture 2>&1 | tee -a "$evidence/ownership-controls.log"
          done
      - name: Measure stack boundaries
        if: matrix.profile == 'release' || needs.scope.outputs.profile_policy == 'full'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          binary=$(cat target/native-stack-evidence/binary-path)
          evidence="target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/$PROFILE"
          python3 tools/native-stack/qualify.py --binary "$binary" --cell "$RUNNER_OS-$RUNNER_ARCH/$PROFILE" --output "$evidence" --chain-log "$evidence/chain-matrix.log" --owned-chain-log "$evidence/owned-chain-matrix.log" --ownership-log "$evidence/ownership-controls.log"
      - name: Run bounded dev smoke
        if: matrix.profile == 'dev' && needs.scope.outputs.profile_policy == 'release'
        run: |
          binary=$(cat target/native-stack-evidence/binary-path)
          evidence="target/native-stack-evidence/$RUNNER_OS-$RUNNER_ARCH/dev"
          python3 tools/native-stack/dev_smoke.py --binary "$binary" --cell "$RUNNER_OS-$RUNNER_ARCH/dev" --output "$evidence"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.profile == 'dev' && needs.scope.outputs.profile_policy == 'release' && format('native-smoke-{0}', matrix.os) || format('native-stack-{0}-{1}', matrix.os, matrix.profile) }}
          path: target/native-stack-evidence/${{ runner.os }}-${{ runner.arch }}/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare native stack outcomes
    needs: [scope, qualify]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.stage == 'qualify') && (needs.scope.result != 'success' || needs.scope.outputs.required == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-stack-*
          path: target/native-stack-compare
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.profile_policy == 'release'
        with:
          pattern: native-smoke-*
          path: target/native-smoke-compare
      - name: Compare required variants
        run: |
          python3 tools/native-stack/compare.py --directory target/native-stack-compare --output target/native-stack-comparison.json --upstream-status "${{ needs.qualify.result }}" --profiles "${{ needs.scope.outputs.profile_policy }}" --smoke-directory target/native-smoke-compare
      - name: Preserve comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-stack-comparison
          path: target/native-stack-comparison.json
          if-no-files-found: error

  s2:
    if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'discovery' || inputs.stage == 'guard' || inputs.stage == 'chain' || inputs.stage == 'vmmap' || inputs.stage == 'final')
    uses: ./.github/workflows/native-stack-s2.yml
    with:
      stage: ${{ inputs.stage }}
      reviewed_discovery_run_id: ${{ inputs.reviewed_discovery_run_id }}
    permissions:
      contents: read
      actions: read
