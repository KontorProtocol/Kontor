name: Docker cache qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Docker cache change scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.select.outputs.docker_cache }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-kontor-tools
      - id: select
        run: RUSTC_WRAPPER='' ./tools/kontor ci-scope pr

  cacher:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Docker cache (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-docker
      - uses: docker/setup-buildx-action@v4
      - name: Cook production dependency cache
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: cacher
          push: false
          cache-from: type=registry,ref=kontorprotocol/kontor:buildcache-main-${{ matrix.arch }}
