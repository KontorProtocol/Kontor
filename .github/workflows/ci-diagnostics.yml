name: CI Diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/rust-tests.yml
      - .github/actions/run-workspace-tests/**
      - .github/workflows/ci-diagnostics.yml
      - .github/actions/setup-kontor-tools/**
      - core/kontor-build/Cargo.toml
      - core/kontor-build/Cargo.lock
      - core/kontor-build/src/main.rs
      - core/kontor-build/src/lib.rs
      - core/kontor-build/src/diagnostics.rs
      - core/kontor-build/src/diagnostics/**
      - core/kontor-build/tests/diagnostics_cli.rs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Crash capture smoke test
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      KONTOR_TOOLS: ${{ github.workspace }}/core/kontor-build/target/debug/kontor-build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kontor-tools
        with:
          run-tests: "true"
      - name: Build abort fixture
        run: |
          cc -x c -o "$RUNNER_TEMP/ci-abort" - <<'C'
          #include <stdlib.h>
          int main(void) { abort(); }
          C
      - name: Prepare diagnostics
        run: '"$KONTOR_TOOLS" diagnostics prepare "$RUNNER_TEMP/macos-crash-diagnostics"'
      - name: Abort fixture
        shell: bash
        run: |
          set +e
          "$KONTOR_TOOLS" diagnostics run "$RUNNER_TEMP/macos-crash-diagnostics/tests.log" "$RUNNER_TEMP/ci-abort"
          status=$?
          set -e
          echo "Fixture exit status: $status" >> "$RUNNER_TEMP/macos-crash-diagnostics/tests.log"
          test "$status" -eq 134
      - name: Collect diagnostics
        if: always()
        run: '"$KONTOR_TOOLS" diagnostics collect "$RUNNER_TEMP/macos-crash-diagnostics"'
      - name: Verify native crash report was captured
        run: |
          jq -e '.copied | keys | any(split("/")[-1] | startswith("ci-abort"))' "$RUNNER_TEMP/macos-crash-diagnostics/reports.json"
          grep -q 'Exit status: 0' "$RUNNER_TEMP/macos-crash-diagnostics/system.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-crash-capture-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-crash-diagnostics/
          if-no-files-found: error
          retention-days: 14
