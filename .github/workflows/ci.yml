name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      sdk: ${{ steps.select.outputs.sdk }}
      reproducible: ${{ steps.select.outputs.reproducible }}
      tooling: ${{ steps.select.outputs.tooling }}
      docker_cache: ${{ steps.select.outputs.docker_cache }}
      stack: ${{ steps.stack.outputs.required }}
      tests: ${{ steps.matrix.outputs.required }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-kontor-tools
      - name: Select checks from complete change set
        id: select
        run: RUSTC_WRAPPER='' ./tools/kontor ci-scope pr
      - id: stack
        run: RUSTC_WRAPPER='' ./tools/kontor ci-scope stack
      - id: matrix
        env:
          RUST_TESTS: ${{ steps.select.outputs.rust }}
          STACK_TESTS: ${{ steps.stack.outputs.required }}
        run: tools/ci/test-matrix.sh

  quality-checks:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ github.job }}-${{ runner.os }}-
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown
      - name: Check formatting (test-contracts)
        run: cargo fmt --all -- --check
        working-directory: ./test-contracts
      - name: Check formatting (native-contracts)
        run: cargo fmt --all -- --check
        working-directory: ./native-contracts
      - name: Check formatting (core)
        run: cargo fmt --all -- --check
        working-directory: ./core
      - name: Run clippy (test-contracts)
        run: cargo clippy --workspace --tests -- -D warnings
        working-directory: ./test-contracts
      - name: Run clippy (native-contracts)
        run: cargo clippy --workspace --tests -- -D warnings
        working-directory: ./native-contracts
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.25.3
      - name: Run clippy (core)
        run: cargo clippy --workspace --tests -- -D warnings
        working-directory: ./core
      - name: Check native helper dependency pins
        run: ./tools/kontor check-native-helper-lock
      - name: Check wit-validator compiles to wasm32-unknown-unknown
        run: cargo check -p wit-validator --target wasm32-unknown-unknown
        working-directory: ./core
      - name: Install cargo-audit
        run: cargo binstall cargo-audit --no-confirm
      - name: Audit (test-contracts)
        run: cargo audit
        working-directory: ./test-contracts
      - name: Audit (native-contracts)
        run: cargo audit
        working-directory: ./native-contracts
      - name: Audit core
        run: |
          cargo audit
          cargo audit --file ../protocol-bundles/first/Cargo.lock
          cargo audit --file ../protocol-bundles/second/Cargo.lock
          cargo audit --file ../protocol-bundles/pulley-first/Cargo.lock
          cargo audit --file ../protocol-bundles/pulley-second/Cargo.lock
          cargo audit --file ../protocol-bundles/executor-first/Cargo.lock
          cargo audit --file ../protocol-bundles/executor-second/Cargo.lock
          cargo audit --file ../protocol-bundles/node/Cargo.lock
        working-directory: ./core

  test:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      matrix: ${{ needs.scope.outputs.test_matrix }}
      stack: ${{ needs.scope.outputs.stack == 'true' }}

  tooling:
    needs: scope
    if: needs.scope.outputs.tooling == 'true' || needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ''
      CCACHE_DISABLE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kontor-tools
        with:
          run-tests: 'true'
      - run: cargo fmt --manifest-path core/kontor-build/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path core/kontor-build/Cargo.toml --all-targets -j2 -- -D warnings
      - run: rustup component add --toolchain 1.99.1 llvm-tools-preview
      - run: cargo test --locked --manifest-path core/kontor-build/Cargo.toml --test object_tools -j2 -- --ignored

  # Match the canonical platform used by both local generation and CI.
  reproducible-build-setup:
    needs: scope
    if: needs.scope.outputs.reproducible == 'true'
    name: Reproducible Build (resolve runner)
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      platform: ${{ steps.resolve.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          platform=$(jq -r .platform tools/build.json)
          case "$platform" in
            linux/amd64) runner=ubuntu-latest ;;
            linux/arm64) runner=ubuntu-24.04-arm ;;
            *) echo "unsupported build.json platform: $platform" >&2; exit 1 ;;
          esac
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  reproducible-build:
    name: Reproducible Contracts & SDK (${{ needs.reproducible-build-setup.outputs.platform }})
    needs: reproducible-build-setup
    runs-on: ${{ needs.reproducible-build-setup.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rebuild and verify contracts and SDK
        env:
          # The lightweight bootstrap does not need the node's sccache setup.
          RUSTC_WRAPPER: ""
        run: ./tools/kontor build --check --runtime docker
      - name: Compare SDK crypto with the pristine reference
        shell: bash
        run: |
          reference_commit=$(jq -r .reference_commit tools/native-crypto/fixtures/sdk-vectors.json)
          [[ "$reference_commit" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$reference_commit"
          sdk_reference="$RUNNER_TEMP/sdk-crypto-reference"
          mkdir -p "$sdk_reference"
          git show "${reference_commit}:sdk/src/component/kontor-sdk.js" > "$sdk_reference/kontor-sdk.js"
          git show "${reference_commit}:sdk/src/component/kontor-sdk.core.wasm" > "$sdk_reference/kontor-sdk.core.wasm"
          printf '{"type":"module"}\n' > "$sdk_reference/package.json"
          node_digest=$(jq -r .node.sha256 tools/build.json)
          ".build-cache/tools/$node_digest/bin/node" tools/native-crypto/compare-sdk.mjs \
            "$sdk_reference/kontor-sdk.js" sdk/src/component/kontor-sdk.js \
            .build-cache/generated/sdk-crypto-parity.json
      - name: Upload staged outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-contracts-and-sdk
          path: .build-cache/generated/
          include-hidden-files: true
          if-no-files-found: error

  sdk:
    needs: scope
    if: needs.scope.outputs.sdk == 'true'
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node + format check first, so a formatting violation fails in
      # seconds rather than after the release `cargo build`.
      - id: sdk-node
        run: echo "version=$(jq -r .node.version tools/build.json)" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.sdk-node.outputs.version }}
      - name: Install SDK dependencies
        run: npm ci
        working-directory: ./sdk
      - name: Check formatting (sdk)
        run: npm run format:check
        working-directory: ./sdk
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ github.job }}-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ github.job }}-${{ runner.os }}-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libzmq3-dev libboost-all-dev libevent-dev gdb
      - name: Download Bitcoin Core v31.1
        run: |
          curl -L -o bitcoin.zip "https://github.com/KontorProtocol/Kontor/releases/download/bitcoin-v31.1/bitcoin-${{ runner.os }}-${{ runner.arch }}.zip"
          unzip bitcoin.zip -d bitcoin-bin
          chmod +x bitcoin-bin/*
          echo "${{ github.workspace }}/bitcoin-bin" >> $GITHUB_PATH
      - name: Test bitcoind
        run: bitcoind --version
      # `kontor regtest` (spawned by the SDK's `startRegtest`) is the
      # release binary; native contracts are committed `.wasm.br`, so this
      # needs no wasm toolchain.
      - name: Build kontor binary
        run: cargo build --release --bin kontor
        working-directory: ./core
      - name: Build SDK
        run: npm run build
        working-directory: ./sdk
      - name: Unit tests
        run: npm test
        working-directory: ./sdk
      - name: Validate installed SDK package
        run: npm run test:package
        working-directory: ./sdk
      - name: Live regtest test
        id: live-regtest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/linux-crash-diagnostics"
          echo "$RUNNER_TEMP/linux-crash-diagnostics/core.%p.%E" | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
          npm run test:regtest
        working-directory: ./sdk
      - name: Collect Linux crash diagnostics
        if: failure() && steps.live-regtest.outcome == 'failure'
        shell: bash
        run: |
          shopt -s nullglob
          for core_file in "$RUNNER_TEMP/linux-crash-diagnostics"/core.*; do
            [[ "$core_file" == *.txt ]] && continue
            executable="${core_file##*/core.}"
            executable="${executable#*.}"
            # Linux encodes the executable path in %E with '!' in place of '/'.
            executable="${executable//!//}"
            if [[ "$executable" != /* || ! -f "$executable" || ! -x "$executable" ]]; then
              echo "Skipping $core_file: executable unavailable: $executable" | tee "$core_file.txt"
              continue
            fi
            if ! gdb --batch \
              -ex 'set pagination off' \
              -ex 'thread apply all bt 50' \
              -ex 'info registers' \
              -ex 'x/16i $pc-32' \
              "$executable" "$core_file" \
              > "$core_file.txt" 2>&1; then
              echo "GDB could not complete diagnostics for $core_file" >> "$core_file.txt"
            fi
            cat "$core_file.txt"
          done
      - name: Preserve Linux crash diagnostics
        if: failure() && steps.live-regtest.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: linux-sdk-crash-reports-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-crash-diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 7

  required-checks:
    name: CI required checks
    if: always()
    needs: [scope, quality-checks, test, tooling, reproducible-build-setup, reproducible-build, sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $needs |
            $needs.scope.result == "success" and
            $needs.tooling.result == (if $needs.scope.outputs.tooling == "true" or $needs.scope.outputs.rust == "true" then "success" else "skipped" end) and
            ([
              {job: "quality-checks", flag: "rust"},
              {job: "test", flag: "tests"},
              {job: "reproducible-build-setup", flag: "reproducible"},
              {job: "reproducible-build", flag: "reproducible"},
              {job: "sdk", flag: "sdk"}
            ] | all(. as $check |
              $needs.scope.outputs[$check.flag] as $selected |
              ($selected == "true" or $selected == "false") and
              $needs[$check.job].result == (if $selected == "true" then "success" else "skipped" end)
            ))
          ' <<<"$NEEDS"

  docker-cache-deps:
    name: Docker - Cache Dependencies (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: scope
    if: github.ref == 'refs/heads/main' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.docker_cache == 'true')
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and cache dependencies only
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          target: cacher
          tags: kontorprotocol/kontor:buildcache-main-${{ matrix.arch }}-cacher
          cache-from: |
            type=registry,ref=kontorprotocol/kontor:buildcache-main-${{ matrix.arch }}
          cache-to: |
            type=inline
            type=registry,ref=kontorprotocol/kontor:buildcache-main-${{ matrix.arch }},mode=max

  docker-build:
    name: Docker - Build Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: docker-cache-deps
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: kontorprotocol/kontor
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=kontorprotocol/kontor:buildcache-main-${{ matrix.arch }}
          cache-to: |
            type=inline
            type=registry,ref=kontorprotocol/kontor:buildcache-main-${{ matrix.arch }},mode=max
          outputs: type=image,name=kontorprotocol/kontor,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Docker - Publish Multi-Arch Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: kontorprotocol/kontor
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'kontorprotocol/kontor@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect kontorprotocol/kontor:${{ steps.meta.outputs.version }}
