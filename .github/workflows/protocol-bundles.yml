name: Protocol bundle qualification

on:
  pull_request:
    paths:
      - "protocol-bundles/**"
      - "tools/protocol-bundles/**"
      - "tools/native-crypto/**"
      - "tools/kontor"
      - "core/kontor-build/**"
      - "core/vendor/**"
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "core/indexer/src/runtime/mod.rs"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/protocol-bundles.yml"
  push:
    branches: [main]
    paths:
      - "protocol-bundles/**"
      - "tools/protocol-bundles/**"
      - "tools/native-crypto/**"
      - "tools/kontor"
      - "core/kontor-build/**"
      - "core/vendor/**"
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "core/indexer/src/runtime/mod.rs"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/protocol-bundles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    name: Protocol bundles (${{ matrix.os }}, release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTC_WRAPPER: ""
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check formats and ownership negative controls
        run: |
          rustfmt --edition 2024 --check protocol-bundles/proof/*.rs
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
          python3 -m unittest discover -s tools/protocol-bundles -p 'test_*.py'
      - name: Check builder CLI
        run: |
          cargo clippy --locked --manifest-path core/Cargo.toml -p kontor-build --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path core/Cargo.toml -p kontor-build -j2
          ./tools/kontor protocol-bundles --help
      - name: Build node qualification image
        if: runner.os == 'Linux'
        run: docker build --target protocol-bundle-qualification -t kontor-protocol-qualification .
      - name: Qualify both real bundles in the node Docker environment
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/protocol-evidence
          docker run --rm --mount type=bind,src="$PWD/target/protocol-evidence",dst=/evidence kontor-protocol-qualification
      - name: Qualify both real bundles with the macOS node test profile
        if: runner.os == 'macOS'
        run: |
          ./tools/kontor protocol-bundles --profile release --output target/protocol-evidence
          test -f target/protocol-evidence/aarch64-apple-darwin/release/qualification.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-bundle-evidence-${{ matrix.os }}
          path: |
            target/protocol-evidence/*/*/*.json
            target/protocol-evidence/*/*/*.log
            target/protocol-evidence/*/*/first/*.json
            target/protocol-evidence/*/*/first/*.log
            target/protocol-evidence/*/*/second/*.json
            target/protocol-evidence/*/*/second/*.log
          if-no-files-found: error
