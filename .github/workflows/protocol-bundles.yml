name: Protocol bundle qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profiles:
        description: Explicit profile coverage (full dev/release is manual only)
        type: choice
        options: [release, full]
        default: release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Linked-node qualification change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      controls: ${{ steps.select.outputs.controls }}
      profile_policy: ${{ steps.select.outputs.profile_policy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-kontor-tools
      - name: Select linked-node builds
        id: select
        run: RUSTC_WRAPPER='' ./tools/kontor ci-scope bundles

  controls:
    name: Linked-node build and evidence controls
    needs: scope
    if: needs.scope.outputs.controls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTC_WRAPPER: ""
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kontor-tools
      - run: rustup component add --toolchain 1.99.1 rustfmt clippy llvm-tools-preview
      - name: Check formats and ownership negative controls
        run: |
          rustfmt --edition 2024 --check protocol-bundles/proof/*.rs
          cargo fmt --manifest-path core/Cargo.toml --all -- --check
      - name: Check builder CLI
        run: |
          cargo clippy --locked --manifest-path core/kontor-build/Cargo.toml --all-targets -j2 -- -D warnings
          cargo test --locked --manifest-path core/kontor-build/Cargo.toml -j2
          cargo test --locked --manifest-path core/kontor-build/Cargo.toml --test object_tools -j2 -- --ignored
          ./tools/kontor protocol-bundles --help

  qualification:
    name: Protocol bundles (${{ matrix.os }}, ${{ matrix.profile }})
    needs: [scope, controls]
    if: needs.scope.outputs.required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        profile: ${{ fromJSON(needs.scope.outputs.profile_policy == 'full' && '["release", "dev"]' || '["release"]') }}
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
      RUSTC_WRAPPER: ""
      CCACHE_DISABLE: "1"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: ./.github/actions/setup-kontor-tools
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: bundle-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock', 'protocol-bundles/**/Cargo.lock') }}
      - name: Identify hosted build environment
        id: environment
        run: printf 'image=%s\n' "${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore isolated graph compilation
        id: graphs
        uses: actions/cache/restore@v6
        with:
          path: |
            target/protocol-evidence/**/target
          key: node-graphs-v1-${{ steps.environment.outputs.image }}-${{ matrix.os }}-${{ runner.arch }}-1.99.1-${{ matrix.profile }}-${{ hashFiles('Dockerfile', 'core/**/Cargo.toml', 'core/Cargo.lock', 'protocol-bundles/**', 'core/kontor-build/src/**') }}-${{ github.sha }}
          restore-keys: |
            node-graphs-v1-${{ steps.environment.outputs.image }}-${{ matrix.os }}-${{ runner.arch }}-1.99.1-${{ matrix.profile }}-${{ hashFiles('Dockerfile', 'core/**/Cargo.toml', 'core/Cargo.lock', 'protocol-bundles/**', 'core/kontor-build/src/**') }}-
      - name: Check compiler and linker output capture before the full build
        run: cargo test --locked --manifest-path core/kontor-build/Cargo.toml --test linker_wrapper --test object_tools -j2 -- --include-ignored
      - name: Install node dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install boost libevent zeromq
      - uses: docker/setup-buildx-action@v4
        if: runner.os == 'Linux'
      - name: Build node qualification image
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: protocol-bundle-qualification
          tags: kontor-protocol-qualification
          load: true
          cache-from: type=gha,scope=node-image-${{ runner.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope=node-image-{0},mode=min', runner.arch) || '' }}
      - name: Qualify executor and consensus bundles in the node Docker environment
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/protocol-evidence
          docker run --rm --mount type=bind,src="$PWD/target/protocol-evidence",dst=/evidence kontor-protocol-qualification tools/kontor qualify-node --output /evidence --profile "${{ matrix.profile }}" --offline
      - name: Qualify executor and consensus bundles with the macOS node test profile
        if: runner.os == 'macOS'
        run: |
          tools/kontor qualify-node --profile "${{ matrix.profile }}" --output target/protocol-evidence
          test -f target/protocol-evidence/aarch64-apple-darwin/${{ matrix.profile }}/executors/managed-node/node-execution.json
      - name: Normalize container cache ownership
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" target/protocol-evidence
      - name: Bound graph cache uploads
        id: budget
        if: github.ref == 'refs/heads/main'
        env:
          MAX_CACHE_KIB: '12582912'
        run: |
          shopt -s globstar nullglob
          tools/ci/cache-budget.sh target/protocol-evidence/**/target
      - name: Save isolated graph compilation
        if: success() && github.ref == 'refs/heads/main' && steps.graphs.outputs.cache-hit != 'true' && steps.budget.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/protocol-evidence/**/target
          key: ${{ steps.graphs.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-bundle-evidence-${{ matrix.os }}-${{ matrix.profile }}
          path: |
            target/protocol-evidence/*/*/executors/managed-node/*.json
            target/protocol-evidence/*/*/executors/managed-node/*.log
            target/protocol-evidence/*/*/executors/managed-node/first/*.json
            target/protocol-evidence/*/*/executors/managed-node/first/*.log
            target/protocol-evidence/*/*/executors/managed-node/observer/*.json
            target/protocol-evidence/*/*/executors/managed-node/observer/*.log
            target/protocol-evidence/*/*/executors/managed-node/node/*.json
            target/protocol-evidence/*/*/executors/managed-node/node/*.log
            target/protocol-evidence/*/*/executors/managed-node/node/type-boundary/*.json
            target/protocol-evidence/*/*/executors/managed-node/node/type-boundary/*.log
            target/protocol-evidence/*/*/executors/managed-node/node/type-boundary/*.rs
            target/protocol-evidence/*/*/consensus/*/*.json
            target/protocol-evidence/*/*/consensus/*/*.log
            target/protocol-evidence/*/*/executors/managed-node/node/consensus/type-boundary/*.json
            target/protocol-evidence/*/*/executors/managed-node/node/consensus/type-boundary/*.log
            target/protocol-evidence/*/*/executors/managed-node/node/consensus/type-boundary/*.rs
            target/protocol-evidence/*/*/executors/managed-node/node/consensus/node-adapter/*.rs
            target/protocol-evidence/*/*/executors/managed-node/node/consensus/node-adapter/*.log
          if-no-files-found: error

  compare:
    name: Compare linked executor outcomes
    needs: [scope, controls, qualification]
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.required == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kontor-tools
      - uses: actions/download-artifact@v8
        with:
          pattern: protocol-bundle-evidence-*
          path: target/protocol-comparison-inputs
      - name: Compare explicitly required platforms and profiles
        run: |
          tools/kontor compare-node --directory target/protocol-comparison-inputs --output target/protocol-node-comparison.json --profiles "${{ needs.scope.outputs.profile_policy }}" --upstream-status "${{ needs.qualification.result }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: protocol-node-comparison
          path: target/protocol-node-comparison.json
          if-no-files-found: error
