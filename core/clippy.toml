disallowed-types = [
    # The guest-side context handle wrappers generated in `built-in-types` are
    # reachable from host code because the indexer depends on that crate for
    # the shared DATA types — but on native targets their methods are
    # wit-bindgen unreachable stubs (there is no host to call). Host code must
    # use the indexer's own Runtime-backed resource types from
    # `crate::runtime::wit` instead.
    { path = "built_in_types::kontor::built_in::context::Contract", reason = "guest-side handle wrapper; use the Runtime-backed type from crate::runtime::wit" },
    { path = "built_in_types::kontor::built_in::context::Holder", reason = "guest-side handle wrapper; use the Runtime-backed type from crate::runtime::wit" },
    { path = "built_in_types::kontor::built_in::context::Signer", reason = "guest-side handle wrapper; use the Runtime-backed type from crate::runtime::wit" },
