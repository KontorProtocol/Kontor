# cargo-audit configuration for the `core` workspace.
#
# These explicit exceptions cover transitive dependencies. Most are pinned by
# dependencies whose fixes require a breaking upgrade; temporary exceptions
# preserving a qualified dependency graph are documented individually below.
# Each entry records its dependency path, exposure and removal condition.
# Re-audit and prune this list whenever those dependencies move.
#
# Run `cargo audit` after any dependency change to confirm no NEW advisory is
# silently swept under these ignores — the list is intentionally explicit (no
# wildcards) so a fresh advisory still fails the build.
#
# NOTE: the entire libsql-transitive advisory cluster (rustls-webpki 0.102.8 ×4
# and h2 0.3.27 ×1) was ELIMINATED — not ignored — by building libsql with
# `default-features = false, features = ["core", "serde"]` (see core/Cargo.toml).
# Kontor uses libsql in embedded/local mode only (`Builder::new_local`), so the
# `remote`/`replication`/`sync`/`tls` default features — which dragged in
# hyper 0.14 / tonic / hyper-rustls 0.25 / rustls 0.22 / rustls-webpki 0.102 and
# the old h2 0.3.x are unused and not compiled, including after the 0.10 upgrade.

[advisories]
ignore = [
    # libz-sys 1.1.30 via indexer's built -> git2 -> libgit2-sys build dependency.
    # On Unix, its probe can log the build environment when compiled with
    # cc >=1.6.0. Cargo retains that output under target/, so shared build
    # directories, caches or verbose logs can expose build-time secrets.
    # Accepted prelaunch exception while retaining the S2-qualified lockfile,
    # not a fix or a claim that build outputs contain no secrets. Remove after
    # updating libz-sys to >=1.1.31 and validating the changed dependency graph.
    # Advisory: https://rustsec.org/advisories/RUSTSEC-2026-0418
    "RUSTSEC-2026-0418",

    # ── hickory-proto 0.25.2 ─────────────────────────────────────────────────
    # Pulled in only by libp2p 0.56 (mDNS / DNS peer discovery), itself pinned
    # by Malachite 0.8.2. Both advisories
    # are DoS-class (CPU exhaustion / unbounded loop) reachable only by a
    # malicious DNS responder during libp2p peer discovery on the local network.
    # 0119 is fixed in hickory 0.26.1; 0118 does not affect the 0.26 series.
    # Malachite still requires libp2p 0.56, whose DNS integration uses 0.25.
    "RUSTSEC-2026-0119", # O(n²) name compression → CPU exhaustion on encode
    "RUSTSEC-2026-0118", # NSEC3 closest-encloser proof → unbounded loop

    # crypto-bigint 0.5.5 via libp2p-identity 0.2 -> p256 0.13 -> elliptic-curve 0.13.
    # Malachite 0.8.2 still requires libp2p 0.56; the fixed crypto-bigint >=0.7.6
    # is outside that dependency chain's compatible version range.
    # Kontor creates Ed25519 network and consensus identities (reactor/engine.rs),
    # but Malachite also compiles ECDSA support. This is an accepted pre-launch
    # exception for the unresolved timing-side-channel advisory, not a fix.
    # Remove when Malachite supports libp2p 0.57+ with patched crypto dependencies,
    # or when a compatible upstream backport becomes available.
    "RUSTSEC-2026-0387",

    # zstd 0.13.3 / zstd-safe 7.3.0 via wasmtime-internal-cache at our pinned
    # Wasmtime fork revision. Its zstd ^0.13 requirement excludes the patched
    # zstd >=0.14.3 / zstd-safe >=8.2.0 chain. Updating the fork is deferred.
    # Kontor does not enable Wasmtime's disk cache in Runtime::new_engine;
    # its ComponentCache is separate. The compiled Wasmtime cache uses
    # encode_all/decode_all, not borrowed stream contexts, seekable decoding,
    # or the stream writer implicated by these advisories.
    # These are accepted exceptions, not dependency fixes. Remove when the
    # Wasmtime dependency uses patched Zstd versions or its cache is excluded.
    # Reassess before enabling disk caching or changing its compression APIs.
    "RUSTSEC-2026-0391", # Reused stream contexts can disclose prior stream data.
    "RUSTSEC-2026-0398", # Seekable decoding can set an out-of-bounds Vec length.
    "RUSTSEC-2026-0403", # Legacy-frame errors can expose uninitialized output.
]
