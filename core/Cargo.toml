[workspace]
members = [
    "bls-crypto",
    "built-in-types",
    "indexer",
    "indexer-types",
    "kontor-sdk",
    "kontor-sdk-native",
    "kontor-sdk-wasm",
    "macros",
    "numerics",
    "stdlib",
    "testlib",
    "wit-validator",
]
resolver = "2"

[workspace.lints.clippy]
new_without_default = "allow"
uninlined_format_args = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# IMPORTANT
wasmtime = { version = "=48.0.1", features = ["wave", "component-model-async"] }
wit-bindgen = "=0.61.1"
wit-component = "=0.254.0"
wit-parser = "=0.254.0"
wasm-wave = { version ="0.254.0", default-features = false }
# =-pinned like the rest of the workspace: the JS side pins the
# uniffi-bindgen-react-native generator/runtime in lockstep (sdk-native
# pins ubrn 0.29.3-1) and a silent `cargo update` bump could desync the
# generated bindings' checksums from the runtime.
uniffi = "=0.29.5"

anyhow = { version = "=1.0.104", default-features = false }
fastnum = "=0.7.5"
num = "=0.4.3"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["http2"] }
# Version is workspace-pinned; each crate selects its own features (bls-crypto
# and indexer-types stay default-features = false for the wasm build).
bitcoin = { version = "=0.32.102", default-features = false }
# Version is workspace-pinned; bls-crypto adds the `portable` feature for wasm.
blst = "=0.3.17"
bon = { version = "=3.10.0", default-features = false, features = ["alloc"] }
bytes = "=1.12.1"
clap = { version = "=4.6.6", features = ["derive"] }
eyre = "=0.6.14"
glob = "=0.3.4"
indexmap = { version = "=2.14.0", features = ["serde"] }
libsql = { version = "=0.9.30", default-features = false, features = ["core", "serde", "stream"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# Held at 0.13: the malachite consensus crates (arc-malachitebft-proto) are on
# prost 0.13, and the codec boundary requires our proto types to implement the
# same prost major's Name trait. Bump in lockstep with malachite.
prost = "=0.13.5"
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
serde_with = { version = "=3.22.0", default-features = false, features = ["alloc", "macros"] }
sha3 = "=0.12.0"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = "=0.7.19"
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = [
  "fs",
  "trace",
  "compression-full",
  "request-id",
  "timeout",
  "catch-panic",
  "cors",
] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ts-rs = { version = "=12.0.1", features = ["format"] }

# Malachite BFT consensus
malachitebft-app-channel = { git = "https://github.com/circlefin/malachite", rev = "5cd137fb99e04c47ed378561708a3d1720ec21a2", package = "arc-malachitebft-app-channel" }

# Pin malachite to the KontorProtocol fork (branch listen-addr-event): stores the
# resolved consensus listen address in network state so it's readable via
# dump_state — used to bring up clusters on `/tcp/0` (no fixed-port allocation).
# Drop this [patch] block once the change lands upstream in circlefin.
[patch."https://github.com/circlefin/malachite"]
arc-malachitebft-app = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-app-channel = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-codec = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-config = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-core-consensus = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-core-driver = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-core-state-machine = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-core-types = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-core-votekeeper = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-discovery = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-engine = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-metrics = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-network = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-peer = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-proto = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-signing = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-signing-ed25519 = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-sync = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }
arc-malachitebft-wal = { git = "https://github.com/KontorProtocol/malachite", rev = "0bf0365bf4f14afae716efd0da8f22879fa8dd52" }

# Optimize the proof-system crates even in dev/test builds. Proof
# generation (kontor-crypto's Nova prover) is exercised only in tests and
# is ~20-30x slower unoptimized; compiling just these deps at opt-level=3
# keeps test proving near release speed while the rest stays debug.
[profile.dev.package.kontor-crypto]
opt-level = 3
[profile.dev.package.kontor-crypto-core]
opt-level = 3
[profile.dev.package.nova-snark]
opt-level = 3
[profile.dev.package.halo2curves]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3

# Profile for the mobile binaries shipped inside apps (@kontor/sdk-native:
# build-mobile.sh, ubrn, .github/workflows/mobile.yml). A dedicated profile
# (not [profile.release]) so tuning for on-device size never perturbs other
# release artifacts — notably the reproducible contract builds.
[profile.mobile]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
