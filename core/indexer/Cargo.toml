[package]
name = "indexer"
version = "0.2.0"
edition = "2024"
default-run = "kontor"

[features]
testing = []

[[bin]]
name = "kontor"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
kontor-build = { path = "../kontor-build" }
stdlib = { path = "../stdlib" }
built-in-types = { path = "../built-in-types", features = ["host"] }
macros = { path = "../macros" }
numerics = { path = "../numerics" }
indexer-types = { path = "../indexer-types" }
wit-validator = { path = "../wit-validator" }
anyhow = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
wasmtime = { workspace = true }
wasm-wave = { workspace = true }
wit-component = { workspace = true }
wasmparser = { workspace = true }
libsql = { workspace = true }
tracing = { workspace = true }
bon = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
ts-rs = { workspace = true }
indexmap = { workspace = true }
bitcoin = { workspace = true, features = ["std", "secp-recovery", "serde", "rand", "rand-std"] }

backon = { version = "=1.6.0", features = ["tokio-sleep"] }
base64 = "=0.23.1"
deadpool = "=0.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
thiserror = "=2.0.21"
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
zmq = "=0.10.0"
scopeguard = "=1.2.0"
rayon = "=1.12.0"
priority-queue = "=2.7.0"
clap = { workspace = true, features = ["env"] }
axum-server = "=0.8.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
hkdf = "=0.13.0"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
brotli = "=9.1.0"
postcard = { workspace = true }
sha2 = "=0.11.1"
num = { workspace = true }
fastnum = { workspace = true }
strum = { version = "=0.28.0", features = ["derive"] }
tracing-stackdriver = "=0.10.0"
regex = "=1.13.1"
kontor-crypto = "0.3.0"
# The field elements returned by kontor-crypto 0.3 implement ff 0.13 traits.
ff = "=0.13.1"
moka = { version = "0.12.16", features = ["future"] }
blst = { workspace = true }
bls-crypto = { path = "../bls-crypto" }
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"

# Malachite BFT consensus
malachitebft-app-channel = { workspace = true }
malachitebft-app = { version = "=0.8.2", package = "arc-malachitebft-app" }
malachitebft-core-types = { version = "=0.8.2", package = "arc-malachitebft-core-types", features = ["serde"] }
malachitebft-engine = { version = "=0.8.2", package = "arc-malachitebft-engine" }
malachitebft-config = { version = "=0.8.2", package = "arc-malachitebft-config" }
malachitebft-signing = { version = "=0.8.2", package = "arc-malachitebft-signing" }
malachitebft-signing-ed25519 = { version = "=0.8.2", package = "arc-malachitebft-signing-ed25519", features = ["rand", "serde"] }
malachitebft-codec = { version = "=0.8.2", package = "arc-malachitebft-codec" }
malachitebft-core-consensus = { version = "=0.8.2", package = "arc-malachitebft-core-consensus" }
malachitebft-proto = { version = "=0.8.2", package = "arc-malachitebft-proto" }
malachitebft-sync = { version = "=0.8.2", package = "arc-malachitebft-sync" }

async-trait = { workspace = true }
bytes = { workspace = true }
prost = { workspace = true }
sha3 = { workspace = true }

[dev-dependencies]
wasm-encoder = { workspace = true }
wasmtime = { workspace = true, features = ["call-hook"] }
testlib = { path = "../testlib" }
dtor = "=1.0.6"

once_cell = "=1.21.4"
axum-test = "=21.1.0"
proptest = "=1.12.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.5", features = ["mm"] }

[build-dependencies]
built = { version = "=0.8.1", features = ["git2"] }
# Generate the same protobuf types consumed by Malachite (prost 0.13).
prost-build = "0.13.5"
protox = "0.8.0"
