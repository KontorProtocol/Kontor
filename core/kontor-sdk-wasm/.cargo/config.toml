[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-simd128", "--remap-path-prefix=/build=/src", "--remap-path-prefix=/build/.build-cache/cargo=/cargo"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
