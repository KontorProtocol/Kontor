[package]
name = "kontor-sdk-native"
version = "0.1.0"
edition = "2024"

[dependencies]
kontor-sdk = { path = "../kontor-sdk" }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
serde_json = { workspace = true }

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
