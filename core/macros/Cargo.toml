[package]
name = "macros"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
# The library backend behind wit-bindgen's `generate!`, driven directly by
# `import!`/`interface!` so the emitted items can be filtered (the embedded
# component-type custom section must NOT ride into contract binaries for an
# imported world).
wit-bindgen-core = { workspace = true }
wit-bindgen-rust = { workspace = true }
wit-parser = { workspace = true }
wit-validator = { path = "../wit-validator" }
anyhow = { workspace = true }

syn = {version = "=2.0.117", features = ["full"]}
quote = "=1.0.46"
proc-macro2 = "=1.0.106"
darling = "=0.23.0"
heck = "=0.5.0"
