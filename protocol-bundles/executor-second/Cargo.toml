[package]
name = "kontor-executor-second"
version = "0.1.0"
edition = "2024"
publish = false
build = "../executor/build.rs"

[workspace]

[lib]
path = "../executor/lib.rs"

[dependencies]
stdlib = { path = "../../core/stdlib" }
built-in-types = { path = "../../core/built-in-types", features = ["host"] }
macros = { path = "../../core/macros" }
numerics = { path = "../../core/numerics" }
indexer-types = { path = "../../core/indexer-types" }
wit-validator = { path = "../../core/wit-validator" }
anyhow = { version = "=1.0.104", default-features = false }
tokio = { version = "=1.53.3", features = ["full"] }
wasmtime = { git = "https://github.com/wilfreddenton/wasmtime", rev = "0dbc68b31c0bcf1a05c93122f1939fb8784e4e48", version = "=51.0.0-kontor.3", default-features = false, features = ["addr2line", "anyhow", "async", "backtrace", "component-model", "component-model-async", "cranelift", "gc-copying", "gc-drc", "gc-null", "pooling-allocator", "pulley", "runtime", "std", "threads", "wat", "wave", "wit-parser"] }
wasm-wave = { version = "=0.262.0", default-features = false }
wit-component = { version = "=0.262.0" }
wasmparser = { version = "=0.262.0", default-features = false, features = ["std", "component-model"] }
tracing = { version = "=0.1.44" }
bon = { version = "=3.10.2", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
serde_with = { version = "=3.24.0", default-features = false, features = ["alloc", "macros"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "secp-recovery", "serde", "rand", "rand-std"] }
futures-util = "=0.3.34"
thiserror = "=2.0.21"
hex = "=0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = "=0.11.1"
num = { version = "=0.4.3" }
fastnum = { version = "=0.7.5" }
regex = "=1.13.1"
brotli = "=9.1.0"
kontor-crypto = "0.3.0"
ff = "=0.13.1"
blst = { version = "=0.3.17" }
bls-crypto = { path = "../../core/bls-crypto" }
moka = { version = "0.12.16", features = ["future"] }

hkdf = "=0.13.0"
strum = { version = "=0.28.0", features = ["derive"] }
sha3 = "=0.12.0"
malachitebft-signing-ed25519 = { version = "=0.8.2", package = "arc-malachitebft-signing-ed25519", features = ["rand", "serde"] }

[patch.crates-io]
wasmtime = { git = "https://github.com/wilfreddenton/wasmtime", rev = "0dbc68b31c0bcf1a05c93122f1939fb8784e4e48", version = "=51.0.0-kontor.3" }
psm = { path = "../../core/vendor/psm" }
wit-bindgen = { path = "../../core/vendor/wit-bindgen" }
blst = { path = "../../core/vendor/blst" }
ring = { path = "../../core/vendor/ring" }
secp256k1-sys = { path = "../../core/vendor/secp256k1-sys" }

[profile.release]
debug = 1
lto = false
panic = "unwind"

[profile.dev]
debug = 1
panic = "unwind"
