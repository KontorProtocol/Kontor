[workspace]
members = ["token", "filestorage", "staking", "system", "nft"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.clippy]
new_without_default = "allow"
uninlined_format_args = "allow"
too_many_arguments = "allow"
unit_arg = "allow"

[workspace.dependencies]
stdlib = { path = "../core/stdlib" }

# Match core's wit-bindgen pin (targeted attribute injection for contract!'s
# `indexed = {...}`). Drop once a release after 0.60.0 carries it.
[patch.crates-io]
wit-bindgen-rust = { git = "https://github.com/bytecodealliance/wit-bindgen", rev = "7687beb996d633d817756f434af2526d442a61d6" }
wit-bindgen-rust-macro = { git = "https://github.com/bytecodealliance/wit-bindgen", rev = "7687beb996d633d817756f434af2526d442a61d6" }
